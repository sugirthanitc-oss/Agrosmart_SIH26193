<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AgriSmart - Intelligent Agricultural Operations Platform</title>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <!-- Agritech Dark-Green Style CSS -->
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app-layout">
    <!-- Desktop Left Sidebar (>= 992px) -->
    <aside class="desktop-sidebar">
      <div class="sidebar-header">
        <div class="brand-title">
          <span>🌿</span>
          <span>AgriSmart</span>
        </div>
        <span class="brand-badge">Enterprise Platform</span>
      </div>

      <nav class="sidebar-nav" id="sidebar-nav-container">
        <!-- Dynamically rendered per role without overlapping legacy menus -->
      </nav>

      <div class="sidebar-footer">
        <div style="display:flex; align-items:center; justify-content:space-between; width:100%; gap:8px;">
          <div class="user-profile-badge" style="flex:1; min-width:0;">
            <div class="user-avatar" id="sidebar-user-avatar">A</div>
            <div style="flex:1; min-width:0;">
              <div id="sidebar-user-name" style="font-size:13px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">Arumugam Sundaram</div>
              <div id="sidebar-user-role" style="font-size:10px; color:var(--mint-light); font-weight:700;">Farmer • TN-FARM-8492</div>
            </div>
          </div>
          <button onclick="handleLogout()" class="agro-sidebar-logout-btn" title="Sign Out / Logout" style="background:rgba(239,68,68,0.15); border:1px solid rgba(239,68,68,0.3); color:#FCA5A5; width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:16px; flex-shrink:0; transition:all 0.2s;" onmouseenter="this.style.background='#DC2626'; this.style.color='#FFFFFF';" onmouseleave="this.style.background='rgba(239,68,68,0.15)'; this.style.color='#FCA5A5';">
            🚪
          </button>
        </div>
      </div>
    </aside>

    <!-- Main Workspace -->
    <div class="main-workspace">
      <!-- Top System Status Bar -->
      <header class="top-system-bar">
        <div class="top-bar-left">
          <span style="font-size:12px; font-weight:800; color:var(--primary); display:flex; align-items:center; gap:6px;">
            <span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:#22C55E; box-shadow:0 0 8px #22C55E;"></span>
            <span>AgriSmart Live Operations</span>
          </span>
        </div>

        <div class="top-bar-right" style="display:flex; align-items:center; gap:10px;">
          <!-- Global Language Switcher -->
          <button id="global-lang-switcher" class="lang-toggle-btn" onclick="toggleLanguage()" title="Switch Language / மொழியை மாற்றுக">
            🌐 <span id="current-lang-label">தமிழ் (TA)</span>
          </button>
          <!-- User Profile Name & Role Block -->
          <div id="top-user-profile-block" onclick="openAuthModal()" style="display:flex; align-items:center; gap:8px; background:rgba(27,77,62,0.06); border:1px solid rgba(27,77,62,0.15); padding:6px 14px; border-radius:10px; cursor:pointer; transition:all 0.2s;" title="Switch Account / Auth Portal">
            <span style="font-size:14px;">👤</span>
            <span id="top-auth-btn-label" style="font-size:12px; font-weight:800; color:var(--primary);">Arumugam Sundaram (Farmer)</span>
          </div>
        </div>
      </header>

      <!-- Main Dynamic Content Area -->
      <main id="app-body" class="content-area">
        <div style="padding: 40px; text-align: center; color: var(--slate);">
          Loading AgriSmart Operations Workspace...
        </div>
      </main>

      <!-- Floating Action Button (+) for Farmer Land Registration -->
      <button id="fab-add-land" class="fab-btn" title="Register Land Parcel" onclick="openLandModal()">+</button>

      <!-- Mobile Bottom Navigation Bar (< 992px) -->
      <nav class="mobile-bottom-bar">
        <button class="mobile-nav-btn active" data-nav="menu" onclick="switchNavTab('menu')">
          <span class="icon">📂</span>
          <span id="mob-nav-menu">Menu</span>
        </button>
        <button class="mobile-nav-btn" data-nav="analytics" onclick="switchNavTab('analytics')">
          <span class="icon">📊</span>
          <span id="mob-nav-analytics">Analytics</span>
        </button>
        <button class="mobile-nav-btn" data-nav="history" onclick="switchNavTab('history')">
          <span class="icon">📜</span>
          <span id="mob-nav-history">History</span>
        </button>
        <button class="mobile-nav-btn" onclick="openEditProfileModal()">
          <span class="icon">👤</span>
          <span id="mob-nav-profile">Profile</span>
        </button>
      </nav>
    </div>
  </div>

  <!-- JavaScript Client Engine -->
  <script src="/app.js"></script>
</body>
</html>
